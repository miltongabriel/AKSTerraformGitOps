apiVersion: v1
kind: Service
metadata:
  name: study-api
  labels:
    tier: backend
spec:
  # Deliberate: provisions a real Azure Load Balancer + public IP (ongoing cost), not ClusterIP/Ingress.
  type: LoadBalancer
  ports:
  - name: http
    port: 80
    targetPort: http
  selector:
    app: study-api
