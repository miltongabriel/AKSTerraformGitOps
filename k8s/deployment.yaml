apiVersion: apps/v1
kind: Deployment
metadata:
  name: study-api-deploy
  labels:
    app: study-api
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: study-api
  template:
    metadata:
      labels:
        app: study-api
    spec:
      terminationGracePeriodSeconds: 30
      # Deliberate hardening: nothing in this pod calls the Kubernetes API.
      automountServiceAccountToken: false
      containers:
        - name: study-api
          # Tag is the commit SHA, updated automatically by .github/workflows/build-push-app.yml on every push to app/.
          image: gbenettiregistry.azurecr.io/study-api:7cfa0d78443b60d8e2010fed77278df2000479f8
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: PORT
              value: "3000"
          # Sized to fit the free-tier Standard_B2pls_v2 node (terraform/profiles/dev.tfvars).
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
