name: 'Terraform Plan'

on:
  push:
    branches: [ "main" ]
    paths:
      - "terraform/**/*.tf"
  pull_request:
    branches: [ "env/*" ]
    types: [ closed ]
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  id-token: write

env:
  TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform.d/plugin-cache

jobs:
  detect-changes:
    name: 'Detect Changes'
    environment: 'dev'
    runs-on: ubuntu-latest
    outputs:
      changed_folders: ${{ steps.filter.outputs.changes }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Folder-agnostic: discovers which top-level module folders under
      # terraform/ (terraform/<module>/**/*.tf) changed, without needing
      # their names hardcoded - so this job is reusable as-is across repos
      # with a different set of module folders.
      - name: Check for Folder Changes
        id: filter
        shell: bash
        run: |
          set -euo pipefail

          event="${{ github.event_name }}"

          if [ "$event" = "workflow_dispatch" ]; then
            # No previous ref to diff against on a manual run: treat every
            # tracked .tf file under terraform/ as in-scope.
            changed_files=$(git ls-tree -r --name-only HEAD -- terraform)
          else
            if [ "$event" = "pull_request" ]; then
              base="${{ github.event.pull_request.base.sha }}"
            else
              base="${{ github.event.before }}"
            fi
            head="${{ github.sha }}"

            if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$base" 2>/dev/null; then
              base=$(git rev-parse "$head"^ 2>/dev/null || echo "")
            fi

            if [ -z "$base" ]; then
              changed_files=$(git ls-tree -r --name-only "$head" -- terraform)
            else
              changed_files=$(git diff --name-only "$base" "$head" -- terraform)
            fi
          fi

          folders=$(printf '%s\n' "$changed_files" \
            | grep -E '^terraform/[^/]+/.*\.tf$' \
            | cut -d/ -f2 \
            | sort -u || true)

          json=$(printf '%s\n' "$folders" | jq -R -s -c 'split("\n") | map(select(length > 0))')

          echo "changes=$json" >> "$GITHUB_OUTPUT"
          echo "Detected changed Terraform folders: $json"

  infra_plan:
    name: 'Terraform Plan'
    environment: 'dev'
    needs: detect-changes
    if: needs.detect-changes.outputs.changed_folders != '[]'
    runs-on: ubuntu-latest
    strategy:
        matrix:
            step: ${{ fromJSON(needs.detect-changes.outputs.changed_folders) }}
    defaults:
      run:
        shell: bash
        working-directory: terraform/${{ matrix.step }}
        
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v2

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Create Plugin Cache Directory
        run: mkdir -p ${{ env.TF_PLUGIN_CACHE_DIR }}

      - name: Cache Terraform Providers
        uses: actions/cache@v4
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: ${{ runner.os }}-terraform-${{ hashFiles('**/.terraform.lock.hcl') }}
          restore-keys: |
            ${{ runner.os }}-terraform-

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      - name: Terraform Format
        id: fmt
        run: terraform fmt -recursive -check

      - name: Terraform Init
        id: init
        run: |
          terraform init \
          -backend-config="subscription_id=${{ secrets.AZURE_SUBSCRIPTION_ID }}" \
          -backend-config="tenant_id=${{ secrets.AZURE_TENANT_ID }}" \
          -backend-config="container_name=${{ vars.AZURE_CONTAINER_NAME }}" \
          -backend-config="resource_group_name=${{ vars.AZURE_RESOURCE_GROUP_NAME }}" \
          -backend-config="storage_account_name=${{ vars.AZURE_STORAGE_ACCOUNT_NAME }}" \
          -input=false

      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color

      - name: Terraform Plan
        id: plan
        run: terraform plan -var-file=../profiles/${{ vars.ENVIRONMENT_NAME }}.tfvars -input=false -no-color -out=tfplan && terraform show -no-color tfplan

      - name: Upload Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: tfplan
          retention-days: 1 # Keep it short-lived for security

      - name: Create Release Branch and PR with Plan
        if: steps.plan.outcome == 'success'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: env/${{ vars.ENVIRONMENT_NAME }}-approval
          base: main
          title: "🚀 Approval Request for ${{ vars.ENVIRONMENT_NAME }}"
          commit-message: "Chore: release main to ${{ vars.ENVIRONMENT_NAME }}"
          body: |
              ## ⚠️ Terraform Plan Summary
              Review the exact infrastructure changes generated from `main` below before approving this deployment.

              <details><summary><b>Click to expand full Terraform Plan output</b></summary>

              ```hcl
              ${{ steps.plan.outputs.stdout }}
              ```

              </details>

  apply-on-approval:
    if: github.event_name == 'pull_request' && github.event.pull_request.merged == true && startsWith(github.head_ref, 'env/')
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Create Plugin Cache Directory
        run: mkdir -p ${{ env.TF_PLUGIN_CACHE_DIR }}

      - name: Cache Terraform Providers
        uses: actions/cache@v4
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: ${{ runner.os }}-terraform-${{ hashFiles('**/.terraform.lock.hcl') }}
          restore-keys: |
            ${{ runner.os }}-terraform-

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      - name: Terraform Format
        id: fmt
        run: terraform fmt -recursive -check

      - name: Terraform Init
        id: init
        run: |
          terraform init \
          -backend-config="subscription_id=${{ secrets.AZURE_SUBSCRIPTION_ID }}" \
          -backend-config="tenant_id=${{ secrets.AZURE_TENANT_ID }}" \
          -backend-config="container_name=${{ vars.AZURE_CONTAINER_NAME }}" \
          -backend-config="resource_group_name=${{ vars.AZURE_RESOURCE_GROUP_NAME }}" \
          -backend-config="storage_account_name=${{ vars.AZURE_STORAGE_ACCOUNT_NAME }}" \
          -input=false

      - name: Terraform Apply
        run: terraform apply -auto-approve
