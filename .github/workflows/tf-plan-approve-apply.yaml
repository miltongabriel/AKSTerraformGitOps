name: 'Terraform Plan'

on:
  push:
    branches: [ "main" ]
    paths:
      - "terraform/**/*.tf"
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

env:
  TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform.d/plugin-cache

jobs:
  detect-changes:
    name: 'Detect Changes'
    runs-on: ubuntu-latest
    outputs:
      changed_folders: ${{ steps.filter.outputs.changes }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      # Folder-agnostic: discovers which top-level module folders under
      # terraform/ (terraform/<module>/**/*.tf) changed, without needing
      # their names hardcoded - so this job is reusable as-is across repos
      # with a different set of module folders.
      - name: Check for Folder Changes
        id: filter
        shell: bash
        run: |
          set -euo pipefail

          event="${{ github.event_name }}"

          if [ "$event" = "workflow_dispatch" ]; then
            # No previous ref to diff against on a manual run: treat every
            # tracked .tf file under terraform/ as in-scope.
            changed_files=$(git ls-tree -r --name-only HEAD -- terraform)
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"

            if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$base" 2>/dev/null; then
              base=$(git rev-parse "$head"^ 2>/dev/null || echo "")
            fi

            if [ -z "$base" ]; then
              changed_files=$(git ls-tree -r --name-only "$head" -- terraform)
            else
              changed_files=$(git diff --name-only "$base" "$head" -- terraform)
            fi
          fi

          folders=$(printf '%s\n' "$changed_files" \
            | grep -E '^terraform/[^/]+/.*\.tf$' \
            | cut -d/ -f2 \
            | sort -u || true)

          json=$(printf '%s\n' "$folders" | jq -R -s -c 'split("\n") | map(select(length > 0))')

          echo "changes=$json" >> "$GITHUB_OUTPUT"
          echo "Detected changed Terraform folders: $json"

  infra_plan:
    name: 'Terraform Plan'
    environment: 'dev-plan'
    needs: detect-changes
    if: needs.detect-changes.outputs.changed_folders != '[]'
    runs-on: ubuntu-latest
    strategy:
        matrix:
            step: ${{ fromJSON(needs.detect-changes.outputs.changed_folders) }}
    defaults:
      run:
        shell: bash
        working-directory: terraform/${{ matrix.step }}

    steps:
      - name: Checkout Repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Azure login (OIDC)
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Create Plugin Cache Directory
        run: mkdir -p ${{ env.TF_PLUGIN_CACHE_DIR }}

      - name: Cache Terraform Providers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: ${{ runner.os }}-terraform-${{ hashFiles('**/.terraform.lock.hcl') }}
          restore-keys: |
            ${{ runner.os }}-terraform-

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.15.8"

      - name: Terraform Format
        id: fmt
        run: terraform fmt -recursive -check

      - name: Terraform Init
        id: init
        run: |
          terraform init \
          -backend-config="container_name=container-aksgitops-${{ vars.ENVIRONMENT_NAME }}-westcentralus-tfstates" \
          -backend-config="resource_group_name=rg-aksgitops-${{ vars.ENVIRONMENT_NAME }}-westcentralus" \
          -backend-config="storage_account_name=${{ vars.AZURE_STORAGE_ACCOUNT_NAME }}" \
          -backend-config="use_azuread_auth=true" \
          -input=false

      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color

      - name: Terraform Plan
        id: plan
        run: terraform plan -var-file=../profiles/${{ vars.ENVIRONMENT_NAME }}.tfvars -input=false -no-color -lock=false -out=tfplan

      - name: Publish Plan to Job Summary
        run: |
          {
            echo "## 📋 Terraform Plan — ${{ matrix.step }}"
            echo '```hcl'
            terraform show -no-color tfplan
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Plan Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tfplan-${{ matrix.step }}
          path: terraform/${{ matrix.step }}/tfplan
          retention-days: 1 # Keep it short-lived for security

  infra_apply:
    name: 'Terraform Apply'
    # This environment must have "Required reviewers" configured
    # (Settings -> Environments -> dev-apply) so this job pauses for
    # manual approval. It is deliberately a different environment than
    # `dev` above, so the unattended plan job is never gated.
    environment: 'dev-apply'
    needs: [detect-changes, infra_plan]
    if: needs.detect-changes.outputs.changed_folders != '[]'
    runs-on: ubuntu-latest
    strategy:
        matrix:
            step: ${{ fromJSON(needs.detect-changes.outputs.changed_folders) }}
    defaults:
      run:
        shell: bash
        working-directory: terraform/${{ matrix.step }}

    steps:
      - name: Checkout Repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Azure login (OIDC)
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Create Plugin Cache Directory
        run: mkdir -p ${{ env.TF_PLUGIN_CACHE_DIR }}

      - name: Cache Terraform Providers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: ${{ runner.os }}-terraform-${{ hashFiles('**/.terraform.lock.hcl') }}
          restore-keys: |
            ${{ runner.os }}-terraform-

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.15.8"

      - name: Terraform Init
        id: init
        run: |
          terraform init \
          -backend-config="container_name=container-aksgitops-${{ vars.ENVIRONMENT_NAME }}-westcentralus-tfstates" \
          -backend-config="resource_group_name=rg-aksgitops-${{ vars.ENVIRONMENT_NAME }}-westcentralus" \
          -backend-config="storage_account_name=${{ vars.AZURE_STORAGE_ACCOUNT_NAME }}" \
          -input=false

      - name: Download Plan Artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: tfplan-${{ matrix.step }}
          path: terraform/${{ matrix.step }}

      # Applies the exact plan that was reviewed in the Job Summary above -
      # not a fresh re-plan - so what got approved is what gets applied.
      - name: Terraform Apply
        run: terraform apply -input=false -auto-approve tfplan
