name: CI

# Validates the repo on every PR and on every push to main/test/prod.
# Terraform fmt/validate/plan still lives in tf-plan-approve-apply.yaml,
# since that needs live Azure auth - but static
# analysis (Checkov) doesn't, so it runs here for PR-time feedback across
# both Terraform trees (terraform/ and bootstrap/), instead of only showing up
# after merge in that pipeline's plan step. The push trigger covers all
# three long-lived branches (not just main) so a promotion merge (see
# promote.yml) gets the same direct-push linting main already gets -
# though in practice a promotion PR is already linted by the pull_request
# trigger above before it's ever merged.

on:
  pull_request:
    paths:
      - "app/**"
      - "k8s/**"
      - "terraform/**/*.tf"
      - "bootstrap/**/*.tf"
      - ".github/workflows/ci.yml"
  push:
    branches: ["main", "test", "prod"]
    paths:
      - "app/**"
      - "k8s/**"
      - "terraform/**/*.tf"
      - "bootstrap/**/*.tf"
      - ".github/workflows/ci.yml"
  workflow_dispatch: {}

jobs:
  app-tests:
    name: app test suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: app/package-lock.json

      - name: npm ci
        run: npm ci --ignore-scripts

      - name: npm test
        run: npm test

  k8s-manifests:
    name: lint plain Kubernetes manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install kubeconform
        run: |
          curl -sSL --proto '=https' --tlsv1.2 https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz \
            | tar -xz -C /usr/local/bin kubeconform

      - name: Validate k8s/ manifests
        run: |
          kubeconform -strict -summary k8s/*.yaml

  terraform-checkov:
    name: Checkov scan (terraform/ + bootstrap/)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@99bb2caf247dfd9f03cf984373bc6043d4e32ebf # v12.1347.0
        with:
          directory: .
          framework: terraform
          output_format: cli
          soft_fail: true
