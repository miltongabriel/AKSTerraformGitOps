name: CI

# Lightweight checks for a study lab: format/syntax validation only, no plan/apply
# (that would need real Azure credentials). Runs on PRs touching terraform/ or the
# plain Kubernetes manifests.

on:
  pull_request:
    paths:
      - "terraform/**"
      - "k8s/**"
      - "mySecondWebApp/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch: {}

jobs:
  terraform:
    name: terraform fmt/validate (${{ matrix.step }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        step: [00-backend, 01-aks, 02-argocd]
    defaults:
      run:
        working-directory: terraform/${{ matrix.step }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      - name: terraform fmt -check
        run: terraform fmt -check -diff

      - name: terraform init (no backend, no live credentials needed)
        run: terraform init -backend=false -input=false

      - name: terraform validate
        run: terraform validate

  k8s-manifests:
    name: lint plain Kubernetes manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz \
            | tar -xz -C /usr/local/bin kubeconform

      - name: Validate k8s/ and mySecondWebApp/ manifests
        run: |
          kubeconform -strict -summary k8s/*.yaml mySecondWebApp/*.yaml
