name: CI

# Validates the non-Terraform parts of the repo on every PR: the app's test
# suite and the plain Kubernetes manifests. Terraform fmt/validate/plan lives
# in tf-plan-approve-apply.yaml instead, since that needs live Azure auth.

on:
  pull_request:
    paths:
      - "app/**"
      - "k8s/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch: {}

jobs:
  app-tests:
    name: app test suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: app/package-lock.json

      - name: npm ci
        run: npm ci

      - name: npm test
        run: npm test

  k8s-manifests:
    name: lint plain Kubernetes manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz \
            | tar -xz -C /usr/local/bin kubeconform

      - name: Validate k8s/ manifests
        run: |
          kubeconform -strict -summary k8s/*.yaml
