name: Build and Push App Image

# Builds app/Dockerfile and pushes it to gbenettiregistry.azurecr.io.
# Auth is via OIDC (azure/login federated credentials) — no static secrets stored.
# Requires an App Registration with a federated credential trusting this repo/branch,
# and its client granted AcrPush (or Contributor) on the gbenettiregistry ACR.

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/build-push-app.yml"
  workflow_dispatch: {}

env:
  REGISTRY_NAME: gbenettiregistry
  REGISTRY: gbenettiregistry.azurecr.io
  IMAGE_NAME: study-api

permissions:
  id-token: write # required for OIDC login to Azure
  contents: read

jobs:
  build-and-push:
    name: Build and push image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to ACR
        run: az acr login --name ${{ env.REGISTRY_NAME }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: app
          file: app/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
