apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mywebapp
  namespace: argocd
spec: 
  project: default
  source: 
    repoURL: git@github.com:miltongabriel/AKSTerraformGitOps.git
    targetRevision: HEAD
    path: k8s
  destination: 
    server: https://kubernetes.default.svc
    namespace: mywebapp
  syncPolicy: 
    automated: 
     prune: true
     selfHeal: true
    syncOptions:
    - CreateNamespace=true