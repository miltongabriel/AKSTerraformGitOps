apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mywebapp2
  namespace: argocd
spec: 
  project: default
  source: 
    repoURL: git@github.com:miltongabriel/AKSTerraformGitOps.git
    targetRevision: HEAD
    path: mySecondWebApp
  destination: 
    server: https://kubernetes.default.svc
    namespace: mywebapp2
  syncPolicy: 
    automated: 
     prune: true
     selfHeal: true