apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mywebapp2
  namespace: argocd
spec:
  # Must match var.argocd_project_name (terraform/02-argocd), which creates this AppProject.
  project: webapp
  source: 
    repoURL: git@github.com:miltongabriel/AKSTerraformGitOps.git
    targetRevision: HEAD
    path: mySecondWebApp
  destination: 
    server: https://kubernetes.default.svc
    namespace: mywebapp2
  syncPolicy: 
    automated: 
     prune: true
     selfHeal: true
    syncOptions:
    - CreateNamespace=true